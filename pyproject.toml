[project]
name = "ksef-connector"
version = "0.1.0"
description = "Wysyłka faktur sprzedaży z Comarch ERP XL do KSeF 2.0"
requires-python = ">=3.11"
dependencies = [
    "lxml>=5.2",
    "httpx>=0.27",
    "cryptography>=43",
    "signxml>=5.2",
]

[project.optional-dependencies]
xl = ["pyodbc>=5.1"]
bq = ["google-cloud-bigquery>=3.25"]  # źródło z BigQuery (panel BOK, polecenie pobierz)
serwis = ["ksef-connector[bq]", "fastapi>=0.115", "uvicorn>=0.30"]  # usługa dla panelu BOK (Cloud Run)
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ksef_connector*"]

[tool.setuptools.package-data]
"ksef_connector.source" = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
